<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Suara Aspirasi Spentiba</title>
  <!-- Menggunakan Tailwind CSS langsung agar tampilan modern tanpa file CSS terpisah -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen p-4 md:p-8 font-sans text-slate-800">

  <div class="max-w-xl mx-auto bg-white p-6 md:p-8 rounded-xl shadow-sm border border-slate-200">
    <div class="text-center mb-8">
      <h1 class="text-2xl font-bold text-indigo-600">Suara Aspirasi Spentiba</h1>
      <p class="text-slate-500 text-sm mt-1">Sampaikan aspirasi, saran, atau keluhan Anda di sini.</p>
    </div>

    <!-- Form Aspirasi -->
    <form id="formAspirasi" class="space-y-5">
      <div>
        <label for="nama" class="block text-sm font-medium text-slate-700 mb-1">Nama (Opsional / Samaran)</label>
        <input type="text" id="nama" placeholder="Boleh dikosongkan" 
          class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition-colors">
      </div>

      <div class="grid grid-cols-2 gap-4">
        <div>
          <label for="kelas" class="block text-sm font-medium text-slate-700 mb-1">Kelas</label>
          <select id="kelas" required 
            class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none bg-white">
            <option value="" disabled selected>Pilih Kelas</option>
            <option value="Kelas 7">Kelas 7</option>
            <option value="Kelas 8">Kelas 8</option>
            <option value="Kelas 9">Kelas 9</option>
            <option value="Alumni/Lainnya">Alumni / Lainnya</option>
          </select>
        </div>
        <div>
          <label for="kategori" class="block text-sm font-medium text-slate-700 mb-1">Kategori</label>
          <select id="kategori" required 
            class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none bg-white">
            <option value="" disabled selected>Pilih Kategori</option>
            <option value="Fasilitas">Fasilitas</option>
            <option value="Pembelajaran">Pembelajaran</option>
            <option value="Kesiswaan">Kesiswaan</option>
            <option value="Lainnya">Lainnya</option>
          </select>
        </div>
      </div>

      <div>
        <label for="isi" class="block text-sm font-medium text-slate-700 mb-1">Isi Aspirasi</label>
        <textarea id="isi" rows="5" required placeholder="Tuliskan aspirasi Anda secara jelas dan sopan..." 
          class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition-colors resize-none"></textarea>
      </div>

      <button type="submit" id="btnSubmit" 
        class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 px-4 rounded-lg transition-colors flex justify-center items-center">
        <span>Kirim Aspirasi</span>
      </button>
    </form>

    <!-- Notifikasi Sukses/Error -->
    <div id="statusMessage" class="hidden mt-4 p-4 rounded-lg text-sm text-center font-medium"></div>
  </div>

  <script>
    // ---------------------------------------------------------
    // 1. GANTI URL DI BAWAH INI DENGAN URL /exec ANDA YANG BARU
    // ---------------------------------------------------------
    const GAS_URL = "https://script.google.com/macros/s/AKfycbyl7U6auIE_uQ6QJ16q-QNZjEAdhwBFuVDTjPZ6ekBA-UyCLw5tVMj4ZxUz4Wm1gbKvbA/exec";

    // Fungsi fetch untuk komunikasi dengan backend GAS
    async function fetchGAS(actionName, payloadData = {}) {
      const response = await fetch(GAS_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({
          action: actionName,
          payload: payloadData
        })
      });
      return await response.json();
    }

    // Mengontrol event saat tombol submit ditekan
    document.getElementById('formAspirasi').addEventListener('submit', async function(e) {
      e.preventDefault(); // Mencegah halaman reload

      const btnSubmit = document.getElementById('btnSubmit');
      const statusBox = document.getElementById('statusMessage');
      
      // Ambil data dari input
      const dataPayload = {
        nama: document.getElementById('nama').value || 'Anonim',
        kelas: document.getElementById('kelas').value,
        kategori: document.getElementById('kategori').value,
        isi: document.getElementById('isi').value
      };

      // Ubah tombol jadi status loading
      btnSubmit.disabled = true;
      btnSubmit.innerHTML = `<svg class="animate-spin h-5 w-5 mr-3 text-white" viewBox="0 0 24 24" fill="none"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg> Mengirim...`;
      statusBox.classList.add('hidden');

      try {
        // Eksekusi fungsi submitAspirasi di GAS
        const result = await fetchGAS('submitAspirasi', dataPayload);

        if (result.status === 'success') {
          // Tampilkan pesan sukses
          statusBox.textContent = `Aspirasi berhasil dikirim! (ID: ${result.data.id})`;
          statusBox.className = 'mt-4 p-4 rounded-lg text-sm text-center font-medium bg-green-100 text-green-700 block';
          this.reset(); // Kosongkan form
        } else {
          throw new Error(result.message);
        }
      } catch (error) {
        // Tampilkan pesan error
        statusBox.textContent = `Gagal mengirim: ${error.message}`;
        statusBox.className = 'mt-4 p-4 rounded-lg text-sm text-center font-medium bg-red-100 text-red-700 block';
      } finally {
        // Kembalikan tombol ke kondisi semula
        btnSubmit.disabled = false;
        btnSubmit.innerHTML = `<span>Kirim Aspirasi</span>`;
      }
    });
  </script>

</body>
</html>
