<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suara Aspirasi Spentiba</title>
    <meta name="description" content="Sistem Aspirasi Online OSIS SMPN 3 Bangil">
    <link rel="icon" href="https://files.catbox.moe/fyelwp.jpg">
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #EFF6FF;
        }
        iframe {
            position: absolute;
            top: -42px; /* Menyembunyikan banner Google */
            left: 0;
            width: 100%;
            height: calc(100dvh + 42px); /* dvh jauh lebih responsif di mobile */
            border: none;
        }
    </style>
</head>
<body>
    <iframe id="app" allowfullscreen></iframe>

    <script>
        const gasUrl = "https://script.google.com/macros/s/AKfycbx9FB9Qx5YAm4-CIha2cCs9HnGGKJ2ryLyOGAG4aJ7iSNOtiNia5kv-gVP9X4TuoiKg1A/exec";
        
        // Langsung sambungkan URL dengan parameter (seperti ?page=admin)
        document.getElementById('app').src = gasUrl + window.location.search;
    </script>
</body>
</html>
