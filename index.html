<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Suara Aspirasi Spentiba</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden; /* Mencegah layar tergulung / scroll ganda */
      background-color: #EFF6FF;
    }
    .iframe-wrapper {
      position: absolute;
      top: -38px; /* Memotong tepat seukuran banner Google Apps Script */
      left: 0;
      width: 100%;
      height: calc(100% + 38px);
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>
  <div class="iframe-wrapper">
    <!-- GANTI DENGAN LINK DEPLOY APPS SCRIPT ANDA -->
    <iframe src="https://script.google.com/macros/s/AKfycbyayJONfkhBfzsAbKxws62r3tQ9ZLTyEaH3xhC30u-2-bDLg_ytLIeyNFbdcBbUsvumog/exec"></iframe>
  </div>
</body>
</html>
