<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suara Aspirasi Spentiba</title>
    <meta name="description" content="Sistem Aspirasi Online OSIS SMPN 3 Bangil">
    <link rel="icon" href="https://files.catbox.moe/fyelwp.jpg" type="image/jpeg">
    <style>
        /* Reset margin & padding agar iframe full screen */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #EFF6FF; /* Sesuai dengan warna dasar tema */
        }
        #gasFrame {
            width: 100vw;
            height: 100vh;
            border: none;
            display: block;
        }
    </style>
</head>
<body>
    <!-- Iframe untuk memuat Google Apps Script (Diizinkan karena XFrameOptionsMode.ALLOWALL) -->
    <iframe id="gasFrame" allowfullscreen></iframe>

    <script>
        // =========================================================================
        // KONFIGURASI PENTING
        // Ganti URL di bawah ini dengan URL Web App Google Apps Script kamu
        // =========================================================================
        const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwxZnwlrCFIGg4aS-LCAnlUUR9rRAKP2o2OwxyFYpruoKbGuz338ZIaCJ-tUNIiiKeiPw/exec";

        // Fitur Routing:
        // Mengambil parameter dari URL Vercel (contoh: ?page=admin atau ?page=cek)
        // dan meneruskannya ke Google Apps Script
        const currentParams = window.location.search;
        
        // Memuat URL ke dalam iframe
        document.getElementById('gasFrame').src = GAS_WEB_APP_URL + currentParams;
    </script>
</body>
</html>
